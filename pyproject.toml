[project]
name = "prime-harness"
version = "0.1.0"
description = "A secure, multi-agent development control room"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["ruff>=0.5,<1.0", "mypy>=1.7,<2.0", "httpx2>=2.13,<3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/test_domain.py" = ["S106", "S108"]
